
# Production logging
logging.level.root=INFO
logging.level.com.example.LearningPlatformApp=INFO

# Avoid verbose SQL output in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


logging.file.name=logs/learning-platform.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB